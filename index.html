infrastructure:()=>`<div class="infrastructure"><div class="panel compute"><div class="diagram-heading"><span>算力：后台任务集中跑</span>${icon('chip')}</div><div class="jobs"><div class="job-stack">${'<i></i>'.repeat(9)}</div><i class="arrow-line"></i><div class="batch-box">Batch Processing</div></div><div class="compute-bottom"><span>利用空闲集群</span><span>自研推理管线</span></div></div><div class="panel security"><div class="diagram-heading"><span>信任：双防火墙独立审查</span>${icon('shield')}</div><div class="security-flow"><div class="firewall">输入防火墙<small>拦 Prompt Injection</small></div>${icon('arrow')}<div class="firewall">Guardrail System<small>执行前审计</small></div></div><div class="veto"><span>异常花钱动作</span><span>拦截 / 挂起 / 再确认</span></div></div></div>`,
future:()=>`<div class="future"><div class="voice"><div class="voice-orb">${icon('mic')}</div><div><strong>一句话交办</strong><small>日常用语音，复杂方案看网页</small></div></div><div class="panel goal"><div class="goal-title"><span>全马提高半小时</span>${icon('target')}</div><div class="goal-steps"><div class="goal-step"><span>反推每日训练</span><small>持续调整</small></div><div class="goal-step"><span>采购食谱所需</span><small>授权执行</small></div><div class="goal-step"><span>安排营养师复盘</span><small>按目标推进</small></div></div><div class="goal-footer">${icon('check')}<span>从一次任务，到长期陪跑</span></div></div></div>`
};
const slides=[
{center:true,cover:true,tag:'INSTINCT',title:'个人 Agent：<br><span class="accent">互联网新入口</span>',subtitle:'Instinct 访谈精读',human:'把网上的事，交给它办完。',keys:['是什么','怎么赚钱','难在哪'],value:'1',unit:'个新入口',label:'从聊天走向代理',author:'创始人兼CEO Noah Shinn'},
{tag:'为什么火',title:'能办事，<br>增长就有了推力',human:'用户开始把真实交易交给它。',keys:['成立约1年','邀请码','日增10%–11%'],value:'100',unit:'亿美元',label:'公司估值',visual:'growth',alt:'用户日增10%至11%的趋势示意，年化 GMV 超10亿美元。'},
{tag:'它是什么',title:'像真人助理<br><span class="accent">一样办事</span>',human:'有电话、邮箱和云端电脑。',keys:['电话','邮箱','云端电脑'],value:'24',unit:'小时',label:'私人助理在线',visual:'assistant',alt:'个人 Agent 通过电话和邮箱接任务，用云端电脑执行。'},
{tag:'真实用法 01',title:'看中一套，<br><span class="accent">直接送到家</span>',human:'从本人试穿到跨平台自动结算。',keys:['衣柜扫描','本人试穿','自动下单'],value:'3',unit:'套 / 天',label:'访谈中的用户用法',visual:'fashion',alt:'扫描衣柜并生成本人试穿效果，选定后跨平台结算寄到家。'},
{tag:'真实用法 02',title:'省钱目标，<br><span class="accent">变成退订动作</span>',human:'授权后，查扣费、抓验证码、退订。',keys:['查订阅','抓验证码','自动退订'],value:'2000',unit:'美元',label:'案例当月省下的费用',visual:'subscription',alt:'授权银行账户后逐笔检查扣费，登录网站、从邮箱抓验证码并完成退订。'},
{tag:'Agent 联网',title:'Agent 能协作，<br><span class="accent">权限有边界</span>',human:'能帮你约时间，也能守住隐私。',keys:['Trust Network','细粒度授权','随时撤销'],value:'6',unit:'位朋友',label:'各自 Agent 协同聚会',visual:'network',alt:'Trust Network 按关系和授权协作；同事仅见空闲时段，其他私人数据隔离，越权即拦截。'},
{tag:'重写商业',title:'越懂你，<br><span class="accent">预订越省心</span>',human:'餐厅订座、OTA订票，一句话办妥。',keys:['餐厅预订','OTA 语音订票','数据网络飞轮'],value:'≈80%',label:'核心授权且获益用户留存',visual:'flywheel',alt:'真实偏好让预订更准，持续使用带来更多数据。旅游出行占 GMV 的50%，核心授权并体验价值的用户长期留存约80%。'},
{tag:'赚钱模式',title:'拒绝广告，<br><span class="accent">赚交易佣金</span>',human:'学 Apple Pay，向商户收费。',keys:['拒绝广告','Apple Pay','Take rate'],value:'0',unit:'广告',label:'创始人明确的商业原则',visual:'commerce',alt:'Instinct 向用户免费，通过撮合与履约向商户收 Take rate，用户获得所需，商户获得订单。'},
{tag:'最难的事',title:'算力要省，<br><span class="accent">信任要守</span>',human:'后台任务要便宜，花钱前要过审。',keys:['Batch Processing','自研管线','Guardrail System'],value:'3–8',unit:'倍',label:'吞吐提升',visual:'infrastructure',alt:'利用空闲集群和自研管线降低后台推理成本；输入防火墙拦 Prompt Injection，独立 Guardrail System 在执行前审计，可否决、挂起或再次确认。'},
{tag:'未来',title:'界面消融，<br><span class="accent">目标变长</span>',human:'说长期目标，它反推每天怎么做。',keys:['Action Button','Mini App','Higher-Level Goals'],value:'4',unit:'个月',label:'全马提速目标示例',visual:'future',alt:'通过语音或 Action Button 交办，复杂方案临时生成网页或 Mini App；Higher-Level Goals 示例为四个月内全马提高半小时，联动训练、食谱采购与复盘。'},
{center:true,tag:'一句话总结',title:'<span class="accent">替你行动，</span><br>成为互联网新入口。',human:'成本降下来，信任与利益要对齐。',keys:['替你行动','降低成本','利益对齐'],value:'2',unit:'道难关',label:'算力与信任'}
];
const deck=document.getElementById('deck');
const keywordHTML=s=>`<ul class="keywords" aria-label="三个关键词">${s.keys.map(k=>`<li>${k}</li>`).join('')}</ul>`;
const metricHTML=s=>`<div class="metric"><strong>${s.value}${s.unit?`<span class="unit">${s.unit}</span>`:''}</strong><span>${s.label}</span></div>`;
slides.forEach((s,i)=>{
const section=document.createElement('section');
section.className='slide'+(s.center?' center':'');section.id='slide-'+(i+1);section.setAttribute('aria-label',`第${i+1}页，共${slides.length}页：${s.tag}`);section.setAttribute('aria-hidden','true');section.inert=true;
const heading=s.cover?'h1':'h2';
const copy=`<p class="eyebrow">${s.tag}${s.center?'':`<span>${String(i+1).padStart(2,'0')}</span>`}</p><${heading}>${s.title}</${heading}>${s.subtitle?`<p class="subtitle">${s.subtitle}</p>`:''}${s.author?`<span class="author">${s.author}</span>`:''}<p class="human">${s.human}</p>${keywordHTML(s)}${metricHTML(s)}`;
section.innerHTML=s.center?`<div class="center-content">${s.cover?`<div class="cover-symbol">${icon('spark')}</div>`:''}${copy}</div>`:`<div class="composition"><div class="copy">${copy}</div><div class="visual" role="img" aria-label="${s.alt}">${visuals[s.visual]()}</div></div>`;
deck.appendChild(section);
});
const pages=[...deck.children],prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('page-count'),progress=document.getElementById('progress'),fill=document.getElementById('progress-fill'),announcement=document.getElementById('announcement');
let current=0,toastTimer;
function hashIndex(){const match=location.hash.match(/^#slide-(\d+)$/);return match?Math.max(0,Math.min(slides.length-1,Number(match[1])-1)):0;}
function show(index,updateHash=true){
const bounded=Math.max(0,Math.min(pages.length-1,index));
if(pages[current]){pages[current].classList.remove('active');pages[current].setAttribute('aria-hidden','true');pages[current].inert=true;}
current=bounded;pages[current].classList.add('active');pages[current].setAttribute('aria-hidden','false');pages[current].inert=false;pages[current].scrollTop=0;
prev.disabled=current===0;next.disabled=current===pages.length-1;
count.innerHTML=String(current+1).padStart(2,'0')+'<span>/'+String(pages.length).padStart(2,'0')+'</span>';
fill.style.width=((current+1)/pages.length*100)+'%';progress.setAttribute('aria-valuenow',String(current+1));progress.setAttribute('aria-valuetext',`第${current+1}页，共${pages.length}页`);announcement.textContent=`第${current+1}页，共${pages.length}页。${slides[current].tag}`;
if(updateHash){try{history.replaceState(null,'','#slide-'+(current+1));}catch(error){/* 本地文件限制不影响翻页。 */}}
}
function step(delta){if(current+delta>=0&&current+delta<pages.length)show(current+delta);}
prev.addEventListener('click',()=>step(-1));next.addEventListener('click',()=>step(1));
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000);}
async function toggleFullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen();}else if(document.webkitFullscreenElement){document.webkitExitFullscreen();}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();}else if(document.documentElement.webkitRequestFullscreen){document.documentElement.webkitRequestFullscreen();}else{toast('此浏览器请使用菜单中的全屏功能。');}}catch(error){toast('全屏未开启，请使用浏览器菜单。');}}
document.getElementById('fullscreen').addEventListener('click',toggleFullscreen);
document.addEventListener('keydown',event=>{
if(event.repeat||event.ctrlKey||event.metaKey||event.altKey||event.target.closest('input,textarea,select,[contenteditable="true"]'))return;
if(['ArrowRight','PageDown'].includes(event.key)){event.preventDefault();step(1);}
else if(['ArrowLeft','PageUp'].includes(event.key)){event.preventDefault();step(-1);}
else if(event.key==='Home'){event.preventDefault();show(0);}
else if(event.key==='End'){event.preventDefault();show(pages.length-1);}
else if(event.key.toLowerCase()==='f'){event.preventDefault();toggleFullscreen();}
else if(event.key===' '&&!event.target.closest('button')){event.preventDefault();step(event.shiftKey?-1:1);}
});
let touchStart=null;
deck.addEventListener('touchstart',event=>{if(event.touches.length===1){const t=event.touches[0];touchStart={x:t.clientX,y:t.clientY};}else touchStart=null;},{passive:true});
deck.addEventListener('touchend',event=>{if(!touchStart||!event.changedTouches.length)return;const t=event.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)step(dx<0?1:-1);touchStart=null;},{passive:true});
deck.addEventListener('touchcancel',()=>{touchStart=null;},{passive:true});
window.addEventListener('hashchange',()=>show(hashIndex(),false));
show(hashIndex(),false);
</script>
